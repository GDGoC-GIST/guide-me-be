spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/news_test
    username: root
    #    password: your_password
  jpa:
    hibernate:
      ddl-auto: create-drop
      show-sql: true
  config:
    import: configserver:http://localhost:8888
firebase:
  bucket-name: your_bucket_name.firebasestorage.app
  url-format: https://firebasestorage.googleapis.com/v0/b/%s/o/%s?alt=media

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

server:
  port: 9000
