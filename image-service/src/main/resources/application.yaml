spring:
  application:
    name: user-service
  profiles:
    active: local
  kafka:
    bootstrap-servers: http://localhost:9092
    consumer:
      group-id: guideme
      auto-offset-reset: earliest
    producer:
      bootstrap-servers: http://localhost:9092

springdoc:
  api-docs:
    path: /api/user/v3/api-docs
  swagger-ui:
    path: /api/user/swagger-ui.index.html
    url: /api/user/v3/api-docs
    config-url: /api/user/v3/api-docs/swagger-config

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,readiness,liveness
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
