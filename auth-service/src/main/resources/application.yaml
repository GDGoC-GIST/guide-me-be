spring:
  application:
    name: auth-service
  profiles:
    active: local
  kafka:
    bootstrap-servers: http://localhost:9092
    consumer:
      group-id: guideme
      auto-offset-reset: earliest
    producer:
      bootstrap-servers: http://localhost:9092
springdoc:
  api-docs:
    path: /api/auth/v3/api-docs
  swagger-ui:
    path: /api/auth/swagger-ui.index.html
    url: /api/auth/v3/api-docs
    config-url: /api/auth/v3/api-docs/swagger-config
