eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    enabled: false
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        - id: auth-service-api
          uri: ${AUTH_SERVICE_PATH}
          predicates:
            - Path=/api/auth/**

        - id: user-service-api
          uri: ${USER_SERVICE_PATH}
          predicates:
            - Path=/api/user/**

client:
  auth-service:
    url: ${AUTH_SERVICE_PATH}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.reactive.function.client.ExchangeFunctions: DEBUG
    org.springframework.web.reactive.function.client.ExchangeFilterFunction: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    reactor.netty.http.client: DEBUG
    org.springframework.web.server.adapter.WebHttpHandlerBuilder: DEBUG
